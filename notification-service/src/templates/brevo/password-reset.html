<!-- Paste into Brevo > Transactional > Templates > code editor.
     Required params when sending: { resetLink: string, year: number } -->
<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /></head>
  <body style="margin:0; padding:0; background-color:#000000;">
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color:#000000; padding:32px 16px;">
      <div style="max-width:600px; margin:0 auto;">
        <div style="text-align:center; padding-bottom:24px;">
          <span style="color:#ffffff; font-size:22px; font-weight:600; letter-spacing:-0.5px;">NexusCart</span>
        </div>
        <div style="background-color:#ffffff; color:#18181b; border-radius:16px; padding:40px;">
          <h2 style="font-size:20px; margin:0 0 16px 0; text-align:center;">Reset your password</h2>
          <p style="font-size:14px; color:#52525b; text-align:center; margin:0 0 8px 0;">
            We received a request to reset your password. If you didn't make this request, you can safely ignore this email.
          </p>
          <p style="font-size:12px; color:#a1a1aa; text-align:center; margin:0 0 24px 0;">
            This link expires in 30 minutes.
          </p>
          <div style="text-align:center; margin-top:32px;">
            <a href="{{ params.resetLink }}" style="display:inline-block; background-color:#000000; color:#ffffff; text-decoration:none; border-radius:100px; padding:14px 32px; font-size:14px; font-weight:600;">
              Reset password
            </a>
          </div>
        </div>
        <div style="text-align:center; padding-top:24px; color:#71717a; font-size:12px; line-height:20px;">
          NexusCart Inc.<br>&copy; {{ params.year }} NexusCart
        </div>
      </div>
    </div>
  </body>
</html>
